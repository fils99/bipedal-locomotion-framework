dt 0.002
safety_threshold 5.0
use_safety_threshold_for_starting_position true
number_of_starting_points 10
bypass_motor_current_measure (true)

[SINUSOID]
min_delta_current             ( 0.02 )
max_delta_current             ( 0.04 )
delta_current_increment       ( 0.01 )
min_frequency                 ( 0.05)
max_frequency                 ( 0.2)
frequency_decrement           ( 0.05 )

[RAMP]
initial_speed                    (0.003)
final_speed                      (0.006)
speed_increment                  (0.003)
max_current_increment            (1.50)

[MOTOR]
joints_list         ("l_hip_roll", "l_hip_pitch", "l_hip_yaw",
                     "l_knee", "l_ankle_pitch", "l_ankle_roll",
                     "r_hip_roll", "r_hip_pitch", "r_hip_yaw",
                     "r_knee", "r_ankle_pitch", "r_ankle_roll")
k_tau                (0.094, 0.064, 0.150,
                     0.064, 0.064, 0.177,
                     0.094, 0.064, 0.150,
                     0.064, 0.064, 0.177)
max_safety_current  (8.0, 8.0, 4.0,
                     6.0, 3.5, 3.0,
                     8.0, 8.0, 4.0,
                     6.0, 3.5, 3.0)

[include ROBOT_CONTROL "./blf_motor_current_tracking/robot_control.ini"]
[include SENSOR_BRIDGE "./blf_motor_current_tracking/sensor_bridge.ini"]
[include DATA_LOGGING  "./blf_motor_current_tracking/data_logging.ini"]