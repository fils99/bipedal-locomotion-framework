dt 0.002
safety_threshold 5.0
use_safety_threshold_for_starting_position false
number_of_starting_points 5
bypass_joint_torque_measure (true)
compensation_bias_forces_factor (0.0)

[SINUSOID]
min_delta_torque             (1.0)
max_delta_torque             (3.0)
delta_torque_increment       (1.0)
min_frequency                 (0.3)
max_frequency                 (0.5)
frequency_decrement           (0.1)

[RAMP]
initial_speed                    (0.02)
final_speed                      (0.04)
speed_increment                  (0.01)
max_torque_increment            (0.06)

[MOTOR]
joints_list         ("l_hip_roll", "l_hip_pitch", "l_hip_yaw",
                     "l_knee", "l_ankle_pitch", "l_ankle_roll",
                     "r_hip_roll", "r_hip_pitch", "r_hip_yaw",
                     "r_knee", "r_ankle_pitch", "r_ankle_roll")
k_tau                (0.094, 0.064, 0.150,
                     0.064, 0.064, 0.177,
                     0.094, 0.064, 0.150,
                     0.064, 0.064, 0.177)
max_safety_current  (8.0, 8.0, 4.0,
                     6.0, 3.5, 3.0,
                     8.0, 8.0, 4.0,
                     6.0, 3.5, 3.0)

[include ROBOT_CONTROL "./joint_torque_tracking/robot_control.ini"]
[include SENSOR_BRIDGE "./joint_torque_tracking/sensor_bridge.ini"]
[include DATA_LOGGING  "./joint_torque_tracking/data_logging.ini"]
